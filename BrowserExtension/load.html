<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ultra Audio Description</title>
  <link rel="stylesheet" href="ui.css">
  <style> body { max-width: 640px; margin: 0 auto; padding-top: 24px; } </style>
</head>
<body>
  <h1 id="title"></h1>
  <label for="file" id="fileLabel"></label>
  <input type="file" id="file" accept=".vtt,.srt,.txt,text/vtt,text/plain">
  <p id="help" class="note"></p>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <button id="close"></button>
  <script src="common.js"></script>
  <script src="load.js"></script>
</body>
</html>
